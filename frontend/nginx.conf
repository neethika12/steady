server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;   # JSON imports

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;   # local AI requests can take a while
  }

  location / {
    try_files $uri /index.html;
  }
}
